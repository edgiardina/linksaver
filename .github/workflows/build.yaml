name: Build

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          os: ubuntu-latest
        - name: Mac
          os: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev
    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      run: |
        brew install sdl2 coreutils
    - name: Build
      if: ${{ matrix.name == 'Linux' }}
      run: make -j$(nproc) zelda3
    - name: Build
      if: ${{ matrix.name == 'Mac' }}
      # Newer Apple clang rejects some of zelda3's K&R-style declarations.
      run: CFLAGS="-O2 -Werror -Wno-deprecated-non-prototype" make -j$(sysctl -n hw.ncpu) zelda3
